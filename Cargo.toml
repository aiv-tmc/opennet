[package]
name = "opennet"
version = "0.4.0"
edition = "2021"
description = "Peer-to-peer network for distributed computing on a LAN"
license = "MPL-2.0"
repository = "https://github.com/aiv-tmc/opennet"
readme = "README.md"
keywords = ["p2p", "distributed", "compute", "trust"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "opennet"
path = "src/lib.rs"

[[bin]]
name = "opennetd"
path = "src/bin/opennetd.rs"

[[bin]]
name = "opennetctl"
path = "src/bin/opennetctl.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rand = "0.10"
blake3 = "1.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bytes = "1"
libc = "0.2"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hex = "0.4"
socket2 = "0.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
