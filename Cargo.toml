[package]
name = "opennet"
version = "0.2.0"
edition = "2021"
description = "Peer-to-peer network for distributed computing on a LAN"
license = "MPL-2.0"
repository = "https://github.com/aiv-tmc/opennet"
readme = "README.md"
keywords = ["p2p", "distributed", "compute", "credits"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "opennet"
path = "src/lib.rs"

[[bin]]
name = "opennetd"
path = "src/bin/opennetd.rs"

[[bin]]
name = "opennetctl"
path = "src/bin/opennetctl.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rand = "0.8"
blake3 = "1.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bytes = { version = "1", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hex = "0.4"
socket2 = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true