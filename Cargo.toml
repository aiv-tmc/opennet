[package]
name = "opennet"
version = "0.1.0"
edition = "2021"

[lib]
name = "opennet"
path = "src/lib.rs"

[[bin]]
name = "opennetd"
path = "src/bin/opennetd.rs"

[[bin]]
name = "opennetctl"
path = "src/bin/opennetctl.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rand = "0.8"
blake3 = "1.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bytes = { version = "1", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hex = "0.4"
socket2 = "0.5"
