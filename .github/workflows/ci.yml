# Continuous integration: every pull request and push to main must pass
# the full release gate (format, clippy with warnings denied, the
# complete release-mode test suite, dependency audit) plus a two-node
# smoke job that boots two real daemons on loopback and executes a task
# across them — the cheapest end-to-end proof the market works.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly: keep the smoke test green even without commits.
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt + clippy + test + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (release mode)
        run: cargo test --release --locked

      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  smoke:
    name: two-node smoke
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked

      # The smoke script starts two daemons on loopback: a seed and a
      # peer that reaches it through the WAN seed path (deterministic
      # in containers where multicast may be unavailable), runs a task
      # across the market, and asserts the settlement end to end.
      - name: Run the two-node smoke scenario
        run: sudo bash scripts/smoke.sh ./target/release/opennetd ./target/release/opennetctl
