name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  package-linux:
    name: linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package
        run: |
          staging="opennet-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/opennetd" "$staging/"
          cp "target/${{ matrix.target }}/release/opennetctl" "$staging/"
          cp README.md LICENSE "$staging/"
          tar -czf "$staging.tar.gz" "$staging"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennet-${{ matrix.target }}
          path: opennet-${{ matrix.target }}.tar.gz

  package-macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin --locked
      - name: Build (Intel)
        run: cargo build --release --target x86_64-apple-darwin --locked
      - name: Package universal binary
        run: |
          staging="opennet-macos-universal"
          mkdir -p "$staging"
          lipo -create \
            target/aarch64-apple-darwin/release/opennetd \
            target/x86_64-apple-darwin/release/opennetd \
            -output "$staging/opennetd"
          lipo -create \
            target/aarch64-apple-darwin/release/opennetctl \
            target/x86_64-apple-darwin/release/opennetctl \
            -output "$staging/opennetctl"
          cp README.md LICENSE "$staging/"
          tar -czf "$staging.tar.gz" "$staging"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennet-macos-universal
          path: opennet-macos-universal.tar.gz

  package-windows:
    name: windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc --locked
      - name: Package
        run: |
          $staging = "opennet-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/opennetd.exe" $staging/
          Copy-Item "target/x86_64-pc-windows-msvc/release/opennetctl.exe" $staging/
          Copy-Item README.md, LICENSE $staging/
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennet-x86_64-pc-windows-msvc
          path: opennet-x86_64-pc-windows-msvc.zip

  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: [package-linux]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: create release
    runs-on: ubuntu-latest
    needs: [package-linux, package-macos, package-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
