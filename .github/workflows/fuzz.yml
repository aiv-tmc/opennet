name: fuzz

on:
  schedule:
    # Nightly short runs: fuzzing is open-ended, so CI gets a bounded
    # slice and the full-length runs stay a maintainer-machine concern.
    - cron: "23 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: libFuzzer (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [decode, signing]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz ${{ matrix.target }} (10 minutes)
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-crash
          path: fuzz/artifacts/
          if-no-files-found: ignore
